# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    environment:
      # The image ships unchecked-hash .pyc files, which would shadow the
      # bind-mounted engine sources below. Point the bytecode cache elsewhere.
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
      # Patched Naver engine (image/video parsers updated for the current
      # Naver DOM, YouTube embeds). Remove once upstream ships the fix.
      - ../searx/engines/naver.py:/usr/local/searxng/searx/engines/naver.py:ro

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
